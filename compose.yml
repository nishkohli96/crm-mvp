services:
  express-server:
    image: docker_username/express-server
    build:
      context: .
      dockerfile: ./apps/express-server/Dockerfile
    ports:
      - '8000:8000'

  next-client:
    image: docker_username/next-client
    build:
      context: .
      dockerfile: ./apps/next-client/Dockerfile
    ports:
      - '3000:3000'
